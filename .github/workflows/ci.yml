name: BankMate AI CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend CI & RAG Evaluation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: backend
      PYTHONIOENCODING: utf-8
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      SYNC_DATABASE_URL: sqlite:///./test_ci.db
      SECRET_KEY: ci-test-secret-key-bankmate-2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint Code Syntax
        run: |
          # Stop build if there are Python syntax errors or undefined names
          python -m flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Seed Knowledge Base & Vector Store
        run: |
          python backend/init_db.py

      - name: Run Backend Unit Tests
        run: |
          pytest backend/tests/test_backend.py -v

      - name: Run 50-Question Automated RAG Benchmark
        run: |
          python backend/tests/run_evaluation.py

      - name: Upload Evaluation Benchmark Report
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: backend/tests/evaluation_report.json
          if-no-files-found: warn

  frontend-build:
    name: Frontend CI & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: bankmate-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: bankmate-frontend:ci-test
